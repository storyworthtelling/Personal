<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="sun-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Morning sky background -->
  <rect width="128" height="128" rx="22" fill="url(#bg)"/>

  <!-- Horizon glow -->
  <ellipse cx="64" cy="60" rx="56" ry="28" fill="#f97316" opacity="0.18"/>

  <!-- Sun rays -->
  <g stroke="#fbbf24" stroke-linecap="round" stroke-width="3">
    <line x1="64" y1="30" x2="64" y2="22"/>
    <line x1="80" y1="35" x2="84" y2="28"/>
    <line x1="48" y1="35" x2="44" y2="28"/>
    <line x1="90" y1="48" x2="96" y2="44"/>
    <line x1="38" y1="48" x2="32" y2="44"/>
  </g>

  <!-- Rising sun (half disc) -->
  <path d="M 42 60 A 22 22 0 0 1 86 60 Z" fill="url(#sun-grad)"/>

  <!-- Book drop shadow -->
  <rect x="10" y="62" width="108" height="54" rx="3" fill="#000" opacity="0.22"/>

  <!-- Left page -->
  <rect x="10" y="59" width="52" height="54" rx="2" fill="#fefce8"/>
  <!-- Right page -->
  <rect x="66" y="59" width="52" height="54" rx="2" fill="#fff7ed"/>
  <!-- Spine -->
  <rect x="60" y="58" width="8" height="56" rx="2" fill="#b45309"/>
  <rect x="61" y="58" width="2.5" height="56" rx="1" fill="#fde68a" opacity="0.35"/>

  <!-- Reading lines on left page -->
  <rect x="16" y="66" width="39" height="3.5" rx="1.5" fill="#78350f" opacity="0.5"/>
  <rect x="16" y="73" width="39" height="2.5" rx="1.5" fill="#78350f" opacity="0.3"/>
  <rect x="16" y="79" width="31" height="2.5" rx="1.5" fill="#78350f" opacity="0.3"/>
  <rect x="16" y="85" width="39" height="2.5" rx="1.5" fill="#78350f" opacity="0.3"/>
  <rect x="16" y="91" width="35" height="2.5" rx="1.5" fill="#78350f" opacity="0.3"/>
  <rect x="16" y="97" width="39" height="2.5" rx="1.5" fill="#78350f" opacity="0.3"/>

  <!-- Calendar on right page -->
  <!-- Month header bar -->
  <rect x="71" y="64" width="41" height="7" rx="2" fill="#ea580c" opacity="0.85"/>
  <!-- Grid: 3 columns × 4 rows, each cell 12×7, gap ~2.5 -->
  <!-- Row 1 -->
  <rect x="71" y="73" width="12" height="7" rx="1.5" fill="#78350f" opacity="0.18"/>
  <rect x="85" y="73" width="12" height="7" rx="1.5" fill="#78350f" opacity="0.18"/>
  <rect x="99" y="73" width="12" height="7" rx="1.5" fill="#78350f" opacity="0.18"/>
  <!-- Row 2 — today highlighted -->
  <rect x="71" y="82" width="12" height="7" rx="1.5" fill="#78350f" opacity="0.18"/>
  <rect x="85" y="82" width="12" height="7" rx="1.5" fill="#ea580c"/>
  <rect x="99" y="82" width="12" height="7" rx="1.5" fill="#78350f" opacity="0.18"/>
  <!-- Row 3 -->
  <rect x="71" y="91" width="12" height="7" rx="1.5" fill="#78350f" opacity="0.18"/>
  <rect x="85" y="91" width="12" height="7" rx="1.5" fill="#78350f" opacity="0.18"/>
  <rect x="99" y="91" width="12" height="7" rx="1.5" fill="#78350f" opacity="0.18"/>
  <!-- Row 4 -->
  <rect x="71" y="100" width="12" height="7" rx="1.5" fill="#78350f" opacity="0.18"/>
  <rect x="85" y="100" width="12" height="7" rx="1.5" fill="#78350f" opacity="0.18"/>
  <rect x="99" y="100" width="12" height="7" rx="1.5" fill="#78350f" opacity="0.18"/>
</svg>
