<?xml version="1.0" encoding="UTF-8"?>
<!-- Storyboarder emblem (adaptive-icon foreground): an open book whose left page (text lines = the
     novel) becomes a 2x2 grid of comic panels on the right page (the graphic novel). White, on the
     indigo background. The viewBox frames the emblem so MAUI scales it to fill the foreground. -->
<svg width="72" height="46" viewBox="18 31 72 46" xmlns="http://www.w3.org/2000/svg">
  <!-- Open-book outline -->
  <path d="M22,35 L54,41 L86,35 L86,67 L54,73 L22,67 Z"
        fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
  <!-- Centre spine -->
  <path d="M54,41 L54,73" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <!-- Left page: text lines (the novel) -->
  <rect x="27" y="47" width="22" height="2" fill="#FFFFFF"/>
  <rect x="27" y="54" width="19" height="2" fill="#FFFFFF"/>
  <rect x="27" y="61" width="16" height="2" fill="#FFFFFF"/>
  <!-- Right page: 2x2 comic panels (the graphic novel) -->
  <rect x="60" y="46" width="9" height="9" fill="#FFFFFF"/>
  <rect x="72" y="46" width="9" height="9" fill="#FFFFFF"/>
  <rect x="60" y="58" width="9" height="9" fill="#FFFFFF"/>
  <rect x="72" y="58" width="9" height="9" fill="#FFFFFF"/>
</svg>
