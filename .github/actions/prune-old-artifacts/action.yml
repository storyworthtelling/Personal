name: Prune old artifacts
description: >
  Delete artifacts from every run of the calling workflow except the current run,
  so only the latest run's artifacts are retained. Frees account artifact storage
  before the current run uploads its own artifacts.

runs:
  using: composite
  steps:
    - name: Delete artifacts from older runs of this workflow
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;

          // Resolve the workflow this run belongs to so we only prune our own runs,
          // leaving other workflows' latest artifacts untouched.
          const { data: thisRun } = await github.rest.actions.getWorkflowRun({
            owner, repo, run_id: context.runId,
          });
          const workflowId = thisRun.workflow_id;

          const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
            owner, repo, workflow_id: workflowId, per_page: 100,
          });

          let deleted = 0;
          for (const run of runs) {
            if (run.id === context.runId) continue;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id: run.id, per_page: 100,
            });
            for (const artifact of artifacts) {
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
              core.info(`Deleted artifact '${artifact.name}' (id ${artifact.id}) from run ${run.id}.`);
              deleted++;
            }
          }
          core.info(`Pruned ${deleted} artifact(s) from older runs of workflow ${workflowId}.`);
