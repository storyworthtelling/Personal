name: Publish signed APKs to the rolling release
description: >
  Upload signed APKs to the single rolling "apps-latest" GitHub Release that the
  FocusPhone launcher's device-owner update channel installs from. A new sibling
  app rides the channel by adding one step that calls this action with its signed
  APK glob (gate it to main); the phone installs it on the next update check,
  because the channel takes any owner-namespace (com.storyworthtelling.*) app that
  is newer than what's installed — or not installed at all.
inputs:
  apks:
    description: Space/newline-separated globs of signed *-Signed.apk files to upload.
    required: true
runs:
  using: composite
  steps:
    - name: Upload to apps-latest release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        shopt -s nullglob
        files=(${{ inputs.apks }})
        if [ ${#files[@]} -eq 0 ]; then
          echo "No signed APKs matched: ${{ inputs.apks }}"
          exit 1
        fi
        # A sidecar beside each APK (<name>.apk.json) names its package and versionCode, read from the APK itself,
        # so the phone decides before downloading whether it needs it (efficiency audit §13). Without aapt2 the APKs
        # go up alone, and the phone downloads and reads them as it always has.
        AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
        [ -z "$AAPT2" ] && AAPT2=$(find "$ANDROID_HOME" -name aapt2 -type f 2>/dev/null | head -1)
        sidecars=()
        for apk in "${files[@]}"; do
          [ -z "$AAPT2" ] && { echo "::warning::aapt2 not found; publishing without sidecars"; break; }
          line=$("$AAPT2" dump badging "$apk" | grep -m1 '^package:')
          package=$(echo "$line" | sed -E "s/.* name='([^']+)'.*/\1/")
          versionCode=$(echo "$line" | sed -E "s/.* versionCode='([0-9]+)'.*/\1/")
          printf '{"package":"%s","versionCode":%s}\n' "$package" "$versionCode" > "$apk.json"
          sidecars+=("$apk.json")
        done
        files+=("${sidecars[@]}")
        echo "Publishing to the apps-latest release:"
        printf '  %s\n' "${files[@]}"
        # One shared rolling release across every app workflow, so releases/latest
        # always carries the current APK of each. Create it once, then clobber this
        # app's own asset(s) on subsequent builds; other apps' assets are untouched.
        if gh release view apps-latest >/dev/null 2>&1; then
          gh release upload apps-latest "${files[@]}" --clobber
        else
          gh release create apps-latest \
            --title "Storyworthtelling apps (latest)" \
            --notes "Rolling release of the latest signed APKs. The FocusPhone launcher's device-owner update channel installs owner-namespace (com.storyworthtelling.*) apps from here." \
            --latest \
            "${files[@]}"
        fi
