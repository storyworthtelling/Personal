name: Build Constitution APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'Constitution/**'
      - 'FocusPhone/Codex.Ui.Android/**'
      - 'FocusPhone/Codex.Domain/**'
      - 'Storyworthtelling.Voice/**'
      - 'Storyworthtelling.Updates/**'
      - 'Tools/IconStudio/**'
      - 'Fonts/**'
      - '.github/workflows/build-constitution.yml'

# A newer push to the same branch makes an in-flight run worthless, so cancel it rather than pay
# for both. main is never cancelled: every main run publishes to the rolling release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Branch pushes run the tests and nothing else — Actions minutes are the budget. main (and a
  # manual "Run workflow", which is how a branch gets its APK) runs the tests inside the build job
  # instead, so one runner does both rather than two.
  test:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Target the test project directly (not the .sln) so the build never touches the
      # net10.0-android head, which would require the Android workload.
      - name: Run tests
        run: dotnet test Constitution/Constitution.Tests/Constitution.Tests.csproj

  build:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # actions: write lets the prune step delete artifacts from older runs;
    # contents: write lets the rolling-release step publish the signed APK.
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: dotnet test Constitution/Constitution.Tests/Constitution.Tests.csproj

      # The runner's default JDK is 17, and javac refuses any binding jar compiled to a newer
      # class-file version. Pinned from the start, as Plate's was (PR #161 fixed it on Flyleaf).
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Constitution is plain .NET-for-Android (not MAUI), so the lighter 'android' workload is enough.
      - name: Install Android workload
        run: dotnet workload install android

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # Keep the committed launcher icon in step with its IconStudio spec on every build.
      - name: Generate launcher icon
        run: dotnet run --project Tools/IconStudio -- --repo-root .

      # The shared repo keystore, so Constitution carries the suite's one signature — required for the
      # device-owner silent-update channel to install it.
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/constitution.keystore

      - name: Compute versionCode
        id: version
        uses: ./.github/actions/version-code
        with:
          band: 10

      - name: Build signed APK
        working-directory: Constitution
        env:
          RUN_NUMBER: ${{ github.run_number }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          DISPLAY_VERSION="1.0.$RUN_NUMBER"
          echo "::group::Publishing Constitution.Android (versionCode $VERSION_CODE, version $DISPLAY_VERSION)"
          dotnet publish Constitution.Android -f net10.0-android -c Release \
            -p:ApplicationVersion=$VERSION_CODE \
            -p:ApplicationDisplayVersion=$DISPLAY_VERSION \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore=/tmp/constitution.keystore \
            -p:AndroidSigningKeyAlias=${{ secrets.KEY_ALIAS }} \
            -p:AndroidSigningKeyPass=${{ secrets.KEY_PASSWORD }} \
            -p:AndroidSigningStorePass=${{ secrets.KEYSTORE_PASSWORD }}
          echo "::endgroup::"

      # The update channel installs by package id, so a wrong one is a second app on the phone.
      # Fatal, because that is invisible until the device has two icons.
      - name: APP ID CHECK
        working-directory: Constitution
        run: |
          set -e
          echo "=== APP ID CHECK ==="
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          APK=$(ls -1 Constitution.Android/bin/Release/net10.0-android/publish/*-Signed.apk 2>/dev/null | head -1)
          echo "--- $APK"
          BADGING=$("$AAPT2" dump badging "$APK")
          echo "$BADGING" | head -2
          echo "$BADGING" | grep -q "name='com.storyworthtelling.constitution'" || {
            echo "FAIL: Constitution's APK does not carry the com.storyworthtelling.constitution ApplicationId."
            exit 1
          }
          echo "ok: ApplicationId present"
          echo "=== END APP ID CHECK ==="

      # Fatal: a Release build only carries the permissions the head declares, and the missing
      # INTERNET permission fails every network call silently.
      - name: PERMISSION CHECK
        working-directory: Constitution
        run: |
          set -e
          echo "=== PERMISSION CHECK ==="
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          APK=$(ls -1 Constitution.Android/bin/Release/net10.0-android/publish/*-Signed.apk 2>/dev/null | head -1)
          echo "--- $APK"
          "$AAPT2" dump permissions "$APK" | grep -q "android.permission.INTERNET" || {
            echo "FAIL: Constitution's APK does not declare android.permission.INTERNET."
            exit 1
          }
          echo "ok: INTERNET declared"
          echo "=== END PERMISSION CHECK ==="

      # Fatal: the INTERNET check above would pass with any health permission at all. Constitution
      # reads from Health Connect and never writes (the brief), so the APK must declare exactly the
      # read set below and nothing that writes, reaches back before install day, or opens medical
      # records. A stray one here is invisible on the phone until Health Connect lists it.
      - name: HEALTH PERMISSION CHECK
        working-directory: Constitution
        run: |
          set -e
          echo "=== HEALTH PERMISSION CHECK ==="
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          APK=$(ls -1 Constitution.Android/bin/Release/net10.0-android/publish/*-Signed.apk 2>/dev/null | head -1)
          echo "--- $APK"
          DECLARED=$("$AAPT2" dump permissions "$APK" | grep -Eo "android\.permission\.health\.[A-Za-z_]+" | sort -u)
          echo "$DECLARED"
          if echo "$DECLARED" | grep -Eq "health\.WRITE|HISTORY|MEDICAL_DATA"; then
            echo "FAIL: the APK declares a health write, history or medical-data permission."
            exit 1
          fi
          EXPECTED=$(printf '%s\n' \
            android.permission.health.READ_WEIGHT \
            android.permission.health.READ_BODY_FAT \
            android.permission.health.READ_RESTING_HEART_RATE \
            android.permission.health.READ_HEART_RATE_VARIABILITY \
            android.permission.health.READ_STEPS \
            android.permission.health.READ_EXERCISE \
            android.permission.health.READ_SLEEP \
            android.permission.health.READ_HEALTH_DATA_IN_BACKGROUND | sort -u)
          if [ "$DECLARED" != "$EXPECTED" ]; then
            echo "FAIL: the APK's health permissions are not exactly the expected read set."
            diff <(echo "$EXPECTED") <(echo "$DECLARED") || true
            exit 1
          fi
          echo "ok: exactly the health read set, nothing that writes"
          echo "=== END HEALTH PERMISSION CHECK ==="

      # Fatal: two heads shipped the DEFAULT launcher icon for months because the wiring is easy
      # to get wrong and silent when it is.
      - name: ICON CHECK
        working-directory: Constitution
        run: |
          set -e
          echo "=== ICON CHECK ==="
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          APK=$(ls -1 Constitution.Android/bin/Release/net10.0-android/publish/*-Signed.apk 2>/dev/null | head -1)
          echo "--- $APK"
          ICON=$("$AAPT2" dump badging "$APK" 2>/dev/null | grep -Eo "application-icon-[0-9]+:'[^']*'" | head -1)
          echo "${ICON:-(no icon line)}"
          if [ -z "$ICON" ]; then
            echo "FAIL: the APK declares no launcher icon."
            exit 1
          fi
          unzip -l "$APK" | grep -Eiq 'mipmap.*appicon' || {
            echo "FAIL: no mipmap appicon resources in the APK."
            unzip -l "$APK" | grep -Ei 'mipmap' | head -10
            exit 1
          }
          echo "ok: launcher icon declared and packaged"
          echo "=== END ICON CHECK ==="

      # Fatal: every one of the EIGHT fonts at the exact path PaperTheme.Load reads
      # (assets/fonts/<name>.ttf), matched by name — a misfiled font crashes the head on launch.
      - name: FONT CHECK
        working-directory: Constitution
        run: |
          set -e
          echo "=== FONT CHECK ==="
          FONTS="SourceSerif4-Regular SourceSerif4-Semibold SourceSerif4-Italic SourceSerif4-Black SourceSans3-Regular SourceSans3-Semibold CascadiaCode-Regular PinyonScript-Regular"
          APK=$(ls -1 Constitution.Android/bin/Release/net10.0-android/publish/*-Signed.apk 2>/dev/null | head -1)
          echo "--- $APK"
          ENTRIES=$(unzip -l "$APK")
          for font in $FONTS; do
            if ! echo "$ENTRIES" | grep -q "assets/fonts/$font.ttf"; then
              echo "FAIL: Constitution is missing assets/fonts/$font.ttf"
              echo "$ENTRIES" | grep -i '\.ttf' || echo "(no .ttf entries at all)"
              exit 1
            fi
          done
          echo "ok: all eight fonts at assets/fonts/"
          echo "=== END FONT CHECK ==="

      # Keep only the latest run's artifacts: delete artifacts from older runs of this
      # workflow before uploading, which also frees storage so the upload succeeds.
      - name: Prune old artifacts
        uses: ./.github/actions/prune-old-artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Constitution-Android
          path: Constitution/Constitution.Android/bin/Release/net10.0-android/publish/*-Signed.apk
          if-no-files-found: error
          retention-days: 90

      # Publish to the rolling "apps-latest" release the phone's update channel installs from.
      # main only — feature-branch builds must never reach the device.
      - name: Publish to rolling GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/publish-rolling-release
        with:
          apks: Constitution/Constitution.Android/bin/Release/net10.0-android/publish/*-Signed.apk
