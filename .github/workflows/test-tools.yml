name: Test tools

# The committed tools' own tests (orphan audit §46). IconStudio regenerates every launcher icon in the app
# builds, and IndexHistorySeal seals the owner's snowball history; both ran in CI, or by hand, without
# their tests. FaceStudio, which generates the watch face (P14), joined with its tests from the start.
# Branch pushes and main both run them: they are quick and publish nothing.
on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'Tools/IconStudio/**'
      - 'Tools/IconStudio.Tests/**'
      - 'Tools/IndexHistorySeal/**'
      - 'Tools/IndexHistorySeal.Tests/**'
      # FaceStudio generates Point, the watch face (P14 W-2.1.1), from the watch's domain and its own font.
      - 'Tools/FaceStudio/**'
      - 'Tools/FaceStudio.Tests/**'
      - 'Watch/Watch.Domain/**'
      - 'Watch/Fonts/**'
      - 'Watch/Point.Face/**'
      # IndexHistorySeal builds on Index's domain and infrastructure (and what they build on).
      - 'Ledger/Ledger.Domain/**'
      - 'Ledger/Ledger.Infrastructure/**'
      - 'Storyworthtelling.Voice/**'
      - 'Storyworthtelling.Diagnostics/**'
      - 'Storyworthtelling.Remarkable/**'
      - 'Storyworthtelling.Handwriting/**'
      - 'Storyworthtelling.Pipeline/**'
      - 'Storyworthtelling.Paper/**'
      - 'Storyworthtelling.Time/**'
      - 'Storyworthtelling.CallSheet/**'
      - 'Storyworthtelling.Materials/**'
      - 'Storyworthtelling.Folds/**'
      - 'Branding/**'
      - 'Fonts/**'
      - '.github/actions/dotnet/**'
      - '.github/workflows/test-tools.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/dotnet

      - name: Test IconStudio
        run: dotnet test Tools/IconStudio.Tests/IconStudio.Tests.csproj

      # Holds the committed face to the tool, checks it against the format's schema, and packs it with aapt2
      # when the runner's Android SDK has build-tools and android-36 (P14 W-3.2.1 makes that required).
      - name: Test FaceStudio
        run: dotnet test Tools/FaceStudio.Tests/FaceStudio.Tests.csproj

      # The tool references Ledger.Infrastructure with AdditionalProperties="LedgerTfms=net10.0", but NuGet
      # restore ignores AdditionalProperties and restores every TFM, so without the global switch it asks for
      # the android workload (NETSDK1147) this job does not install. build-index.yml passes the same switch.
      - name: Test IndexHistorySeal
        run: dotnet test Tools/IndexHistorySeal.Tests/IndexHistorySeal.Tests.csproj -p:LedgerTfms=net10.0
