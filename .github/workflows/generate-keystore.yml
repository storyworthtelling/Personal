name: Generate Signing Keystore

# For disaster recovery only. The keystore already exists, and every com.storyworthtelling app is
# updated in place against its signature, so a new one would make every installed app refuse its next
# update. The job therefore refuses to run while the KEYSTORE_BASE64 secret is set.
#
# The repository is public, so nothing here may print the keystore: a run's summary and logs can be
# read by anyone. If the job must run, it uploads the keystore as a one-day artifact encrypted with
# KEYSTORE_EXPORT_PASSPHRASE (a secret you create for the run and delete afterwards), never in plain text.
#
# Before running:
#   1. Add KEY_PASSWORD, KEYSTORE_PASSWORD and KEYSTORE_EXPORT_PASSPHRASE secrets
#      (Settings → Secrets → Actions → New)
# After running:
#   2. Download the "keystore-encrypted" artifact and decrypt it on your own machine:
#        openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in dailyloader.keystore.enc -out dailyloader.keystore
#   3. Add its base64 as the KEYSTORE_BASE64 secret, add KEY_ALIAS = dailyloader,
#      then delete KEYSTORE_EXPORT_PASSPHRASE and the artifact.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse while a keystore is already in use
        env:
          EXISTING: ${{ secrets.KEYSTORE_BASE64 }}
          EXPORT_PASSPHRASE: ${{ secrets.KEYSTORE_EXPORT_PASSPHRASE }}
        run: |
          if [ -n "$EXISTING" ]; then
            echo "KEYSTORE_BASE64 is already set. A new keystore would break every in-place update; nothing was generated." >&2
            exit 1
          fi
          if [ -z "$EXPORT_PASSPHRASE" ]; then
            echo "Set the KEYSTORE_EXPORT_PASSPHRASE secret first; the keystore is never written out unencrypted." >&2
            exit 1
          fi

      # CN stays DailyLoader after the Foreword rename, deliberately. This is the ONE keystore every
      # com.storyworthtelling app signs with, and the certificate already issued carries this name.
      - name: Generate keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          keytool -genkey -v \
            -keystore dailyloader.keystore \
            -alias dailyloader \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=DailyLoader, O=Personal" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD"

      - name: Encrypt the keystore
        env:
          EXPORT_PASSPHRASE: ${{ secrets.KEYSTORE_EXPORT_PASSPHRASE }}
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -in dailyloader.keystore -out dailyloader.keystore.enc -pass env:EXPORT_PASSPHRASE
          rm dailyloader.keystore

      - name: Upload the encrypted keystore
        uses: actions/upload-artifact@v4
        with:
          name: keystore-encrypted
          path: dailyloader.keystore.enc
          retention-days: 1
          if-no-files-found: error

      - name: Say what to do next
        run: |
          echo "## Keystore generated" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the encrypted artifact and follow the steps at the top of generate-keystore.yml." >> "$GITHUB_STEP_SUMMARY"
