name: Generate Signing Keystore

# Run this ONCE to create the keystore. Before running:
#   1. Add KEY_PASSWORD secret  (Settings → Secrets → Actions → New)
#   2. Add KEYSTORE_PASSWORD secret
# After running:
#   3. Copy KEYSTORE_BASE64 from the job summary and add it as a secret
#   4. Add KEY_ALIAS = nytremarkable

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore nytremarkable.keystore \
            -alias nytremarkable \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=NytRemarkable, O=Personal" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}"

      - name: Output KEYSTORE_BASE64 to job summary
        run: |
          echo "## Setup complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Add the value below as GitHub secret **\`KEYSTORE_BASE64\`**:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          base64 -w 0 nytremarkable.keystore >> $GITHUB_STEP_SUMMARY
          echo >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Also add secret **\`KEY_ALIAS\`** = \`nytremarkable\`" >> $GITHUB_STEP_SUMMARY
