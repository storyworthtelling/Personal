name: Build Storyboarder APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'Storyboarder/Storyboarder.Android/**'
      - 'Storyboarder/Storyboarder.Infrastructure/**'
      - 'Storyboarder/Storyboarder.Domain/**'
      - 'Storyboarder/Storyboarder.Tests/**'
      - '.github/workflows/build-storyboarder.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Target the test project directly (not the .sln) so the build never touches the
      # net10.0-android head, which would require the MAUI/Android workload. The
      # -p:StoryboarderTfms switch keeps Infrastructure single-targeted at net10.0.
      - name: Run tests
        run: >
          dotnet test Storyboarder/Storyboarder.Tests/Storyboarder.Tests.csproj
          -p:StoryboarderTfms=net10.0

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/storyboarder.keystore

      - name: Build APK
        working-directory: Storyboarder
        run: >
          dotnet publish Storyboarder.Android -f net10.0-android -c Release
          -p:AndroidPackageFormat=apk
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore=/tmp/storyboarder.keystore
          -p:AndroidSigningKeyAlias=${{ secrets.KEY_ALIAS }}
          -p:AndroidSigningKeyPass=${{ secrets.KEY_PASSWORD }}
          -p:AndroidSigningStorePass=${{ secrets.KEYSTORE_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Storyboarder-Android
          path: Storyboarder/Storyboarder.Android/bin/Release/net10.0-android/publish/*.apk
          if-no-files-found: error
          retention-days: 90
