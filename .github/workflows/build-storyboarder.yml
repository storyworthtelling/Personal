name: Build Storyboarder APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'Storyboarder/Storyboarder.Android/**'
      - 'Storyboarder/Storyboarder.Infrastructure/**'
      - 'Storyboarder/Storyboarder.Domain/**'
      - 'Storyboarder/Storyboarder.Tests/**'
      - '.github/workflows/build-storyboarder.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Target the test project directly (not the .sln) so the build never touches the
      # net10.0-android head, which would require the MAUI/Android workload. The
      # -p:StoryboarderTfms switch keeps Infrastructure single-targeted at net10.0.
      - name: Run tests
        run: >
          dotnet test Storyboarder/Storyboarder.Tests/Storyboarder.Tests.csproj
          -p:StoryboarderTfms=net10.0

  build:
    needs: test
    runs-on: ubuntu-latest
    # actions: write lets the prune step delete artifacts from older runs.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/storyboarder.keystore

      - name: Build APK
        working-directory: Storyboarder
        run: >
          dotnet publish Storyboarder.Android -f net10.0-android -c Release
          -p:AndroidPackageFormat=apk
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore=/tmp/storyboarder.keystore
          -p:AndroidSigningKeyAlias=${{ secrets.KEY_ALIAS }}
          -p:AndroidSigningKeyPass=${{ secrets.KEY_PASSWORD }}
          -p:AndroidSigningStorePass=${{ secrets.KEYSTORE_PASSWORD }}

      # Prove the launcher icon is actually in the APK. In a multi-project MAUI head the resizetizer
      # has silently shipped the default icon before, so we no longer trust "it built". Print-only /
      # non-fatal: shows the packaged icon resources and the manifest's resolved android:icon, so a
      # green build confirms the custom icon is present (grep for "=== ICON CHECK ===" in the log).
      - name: ICON CHECK
        continue-on-error: true
        working-directory: Storyboarder
        run: |
          set +e
          echo "=== ICON CHECK ==="
          APK=$(ls -1 Storyboarder.Android/bin/Release/net10.0-android/publish/*-Signed.apk 2>/dev/null | head -1)
          [ -z "$APK" ] && APK=$(ls -1 Storyboarder.Android/bin/Release/net10.0-android/publish/*.apk 2>/dev/null | head -1)
          echo "APK: $APK"
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          [ -z "$AAPT2" ] && AAPT2=$(find "$ANDROID_HOME" -name aapt2 -type f 2>/dev/null | head -1)
          echo "aapt2: $AAPT2"
          echo "--- manifest application icon (aapt2 dump badging) ---"
          "$AAPT2" dump badging "$APK" 2>/dev/null | grep -Ei 'application(-icon)?:|launchable-activity' || echo "(aapt2 badging produced no icon line)"
          echo "--- packaged icon resources (unzip -l) ---"
          unzip -l "$APK" | grep -Ei 'mipmap|appicon' || echo "(no mipmap/appicon entries found in APK)"
          echo "=== END ICON CHECK ==="

      # Keep only the latest run's artifacts: delete artifacts from older runs of
      # this workflow before uploading, which also frees storage so the upload succeeds.
      - name: Prune old artifacts
        uses: ./.github/actions/prune-old-artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Storyboarder-Android
          path: Storyboarder/Storyboarder.Android/bin/Release/net10.0-android/publish/*.apk
          if-no-files-found: error
          retention-days: 90
