name: Build Flyleaf APKs

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'FocusPhone/Flyleaf.Android/**'
      - 'FocusPhone/Score.Android/**'
      - 'FocusPhone/Codex.Ui.Android/**'
      - 'FocusPhone/Codex.Domain/**'
      - 'FocusPhone/Codex.Infrastructure/**'
      - 'FocusPhone/Codex.Tests/**'
      - 'Storyworthtelling.Updates/**'
      - '.github/workflows/build-flyleaf.yml'

# A newer push to the same branch makes an in-flight run worthless, so cancel it rather than pay
# for both. main is never cancelled: every main run publishes to the rolling release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Branch pushes run the tests and nothing else — Actions minutes are the budget, and signing an
  # APK on every push of a working branch, then again on merge, is where they went. main (and a
  # manual "Run workflow", which is how a branch gets its APK compiled when it needs one) runs the
  # tests inside the build job instead, so one runner does both rather than two.
  test:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Target the test project directly (not the .sln) so the build never touches the
      # net10.0-android heads, which would require the Android workload.
      - name: Run tests
        run: dotnet test FocusPhone/Codex.Tests/Codex.Tests.csproj

  build:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # actions: write lets the prune step delete artifacts from older runs;
    # contents: write lets the rolling-release step publish signed APKs.
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Target the test project directly (not the .sln) so the build never touches the
      # net10.0-android heads, which would require the Android workload.
      - name: Run tests
        run: dotnet test FocusPhone/Codex.Tests/Codex.Tests.csproj

      # Score's TIDAL Player binding ships jars compiled to Java 21 (class file
      # major 65). The runner's default JDK is 17, whose javac reads major 61 and
      # refuses them outright — "class file has wrong version 65.0, should be 61.0"
      # — and the generated ImmediateFuture stub also calls Future.State, which
      # does not exist before Java 19. Pin the JDK rather than inherit the runner's:
      # this passed locally on JDK 21 against the same Android SDK pack (36.1.69)
      # while CI was down, so the difference was never visible until now.
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The FocusPhone heads are plain .NET-for-Android (not MAUI), so the lighter
      # 'android' workload is sufficient. Plate — the head whose ML Kit bindings need
      # dl.google.com at build time — has its own workflow (build-plate.yml), so that
      # download is no longer this build's problem and a binding failure there cannot
      # stop Flyleaf and Score shipping.
      - name: Install Android workload
        run: dotnet workload install android

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # Every head signs with the one shared repo keystore so the suite carries a
      # single signature — required for the device-owner silent-update channel to
      # accept updates across it. Post signs with the same keystore from its own
      # workflow (build-post.yml), which is also where the gmbridge build moved.
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/focusphone.keystore

      - name: Compute versionCode
        id: version
        uses: ./.github/actions/version-code
        with:
          band: 1

      - name: Build signed APKs
        working-directory: FocusPhone
        env:
          RUN_NUMBER: ${{ github.run_number }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          for proj in Flyleaf.Android Score.Android; do
            # Flyleaf graduates from the 0.1 pilot to a 1.x major; the other heads stay 0.1.
            case "$proj" in
              Flyleaf.Android) DISPLAY_VERSION="1.0.$RUN_NUMBER" ;;
              Score.Android)   DISPLAY_VERSION="1.0.$RUN_NUMBER" ;;
              *)               DISPLAY_VERSION="0.1.$RUN_NUMBER" ;;
            esac
            echo "::group::Publishing $proj (versionCode $VERSION_CODE, version $DISPLAY_VERSION)"
            dotnet publish "$proj" -f net10.0-android -c Release \
              -p:ApplicationVersion=$VERSION_CODE \
              -p:ApplicationDisplayVersion=$DISPLAY_VERSION \
              -p:AndroidPackageFormat=apk \
              -p:AndroidKeyStore=true \
              -p:AndroidSigningKeyStore=/tmp/focusphone.keystore \
              -p:AndroidSigningKeyAlias=${{ secrets.KEY_ALIAS }} \
              -p:AndroidSigningKeyPass=${{ secrets.KEY_PASSWORD }} \
              -p:AndroidSigningStorePass=${{ secrets.KEYSTORE_PASSWORD }}
            echo "::endgroup::"
          done

      # Prove the Paper & Ink launcher icons are packaged (same rationale as
      # Storyboarder's ICON CHECK: don't trust "it built"). Print-only /
      # non-fatal; grep the log for "=== ICON CHECK ===".
      - name: ICON CHECK
        continue-on-error: true
        working-directory: FocusPhone
        run: |
          set +e
          echo "=== ICON CHECK ==="
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          for proj in Flyleaf.Android Score.Android; do
            APK=$(ls -1 "$proj"/bin/Release/net10.0-android/publish/*-Signed.apk 2>/dev/null | head -1)
            [ -z "$APK" ] && APK=$(ls -1 "$proj"/bin/Release/net10.0-android/publish/*.apk 2>/dev/null | head -1)
            echo "--- $proj: $APK"
            "$AAPT2" dump badging "$APK" 2>/dev/null | grep -Ei 'application(-icon)?:' || echo "(no icon line)"
            unzip -l "$APK" | grep -Ei 'mipmap.*appicon' | head -4 || echo "(no appicon entries)"
          done
          echo "=== END ICON CHECK ==="

      # Fatal: prove the six shared fonts are packaged at the exact internal
      # path PaperTheme.Load reads them from (assets/fonts/<name>.ttf). Counting
      # ".ttf" is not enough — a Link separator bug can pack them under a wrong
      # literal name (e.g. "assets/Assets\fonts\Foo.ttf") so Assets.Open fails
      # and every head crashes on launch. A misfiled font must fail the build.
      - name: FONT CHECK
        working-directory: FocusPhone
        run: |
          set -e
          echo "=== FONT CHECK ==="
          FONTS="SourceSerif4-Regular SourceSerif4-Semibold SourceSerif4-Italic SourceSans3-Regular SourceSans3-Semibold CascadiaCode-Regular"
          for proj in Flyleaf.Android Score.Android; do
            APK=$(ls -1 "$proj"/bin/Release/net10.0-android/publish/*-Signed.apk 2>/dev/null | head -1)
            [ -z "$APK" ] && APK=$(ls -1 "$proj"/bin/Release/net10.0-android/publish/*.apk 2>/dev/null | head -1)
            echo "--- $proj: $APK"
            ENTRIES=$(unzip -l "$APK")
            for font in $FONTS; do
              if ! echo "$ENTRIES" | grep -q "assets/fonts/$font.ttf"; then
                echo "FAIL: $proj is missing assets/fonts/$font.ttf"
                echo "$ENTRIES" | grep -i '\.ttf' || echo "(no .ttf entries at all)"
                exit 1
              fi
            done
            echo "ok: all six fonts at assets/fonts/"
          done
          echo "=== END FONT CHECK ==="

      # Keep only the latest run's artifacts: delete artifacts from older runs of
      # this workflow before uploading, which also frees storage so the upload succeeds.
      - name: Prune old artifacts
        uses: ./.github/actions/prune-old-artifacts

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Flyleaf-Android
          path: |
            FocusPhone/Flyleaf.Android/bin/Release/net10.0-android/publish/*-Signed.apk
            FocusPhone/Score.Android/bin/Release/net10.0-android/publish/*-Signed.apk
          if-no-files-found: error
          retention-days: 90

      # Publish the signed heads to the rolling "apps-latest" release the phone's
      # update channel installs from. main only — feature-branch builds must never
      # reach the device.
      - name: Publish to rolling GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/publish-rolling-release
        with:
          # Every head is listed by its own path. The FocusPhone.*.Android glob this
          # replaces silently stopped matching a head each time one was renamed: it
          # missed Flyleaf (noted at the time) and then missed Score too, so Score has
          # never actually reached the rolling release. A glob over project folders is
          # the wrong shape for a list that renames — spell them out.
          apks: |
            FocusPhone/Flyleaf.Android/bin/Release/net10.0-android/publish/*-Signed.apk
            FocusPhone/Score.Android/bin/Release/net10.0-android/publish/*-Signed.apk
