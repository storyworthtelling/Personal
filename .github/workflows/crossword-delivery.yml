name: Deliver NYT Crossword

on:
  schedule:
    - cron: '0 11 * * *'  # 11:00 UTC = 6 AM EST (7 AM EDT in summer)
  workflow_dispatch:        # allows manual trigger from GitHub Actions UI

jobs:
  deliver:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build
        working-directory: NytRemarkable
        run: dotnet build NytRemarkable.Worker -c Release

      - name: Install Playwright browsers
        working-directory: NytRemarkable
        run: pwsh NytRemarkable.Worker/bin/Release/net9.0/playwright.ps1 install chrome --with-deps

      - name: Deliver crossword
        working-directory: NytRemarkable
        env:
          Nyt__SessionCookie: ${{ secrets.NYT_SESSION_COOKIE }}
          NytApi__ApiKey: ${{ secrets.NYT_API_KEY }}
          Remarkable__DeviceToken: ${{ secrets.REMARKABLE_DEVICE_TOKEN }}
        run: dotnet run --project NytRemarkable.Worker -c Release --no-build -- --deliver

      - name: Notify on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: storyworthtelling@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: storyworthtelling@gmail.com
          from: NYT Crossword Delivery
          subject: "Crossword delivery failed — NYT-S cookie probably expired"
          body: |
            The daily crossword delivery failed. This usually means your NYT-S
            session cookie has expired and needs to be refreshed.

            To fix it:
            1. Go to nytimes.com in your browser (make sure you're logged in)
            2. Open DevTools → Application → Cookies → nytimes.com
            3. Copy the value of the NYT-S cookie
            4. Go to your GitHub repo → Settings → Secrets and variables → Actions
            5. Update the NYT_SESSION_COOKIE secret with the new value
            6. Re-run the failed workflow from the link below

            Failed run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
