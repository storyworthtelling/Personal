name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'DailyLoader/DailyLoader.Android/**'
      - 'DailyLoader/DailyLoader.Infrastructure/**'
      - 'DailyLoader/DailyLoader.Domain/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    # actions: write lets the prune step delete artifacts from older runs.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/dailyloader.keystore

      - name: Build APK
        working-directory: DailyLoader
        run: >
          dotnet publish DailyLoader.Android -f net9.0-android -c Release
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore=/tmp/dailyloader.keystore
          -p:AndroidSigningKeyAlias=${{ secrets.KEY_ALIAS }}
          -p:AndroidSigningKeyPass=${{ secrets.KEY_PASSWORD }}
          -p:AndroidSigningStorePass=${{ secrets.KEYSTORE_PASSWORD }}

      # Prove the Paper & Ink launcher icon and shared fonts are actually packaged.
      # Print-only / non-fatal; grep the log for "=== ICON+FONT CHECK ===".
      - name: ICON+FONT CHECK
        continue-on-error: true
        working-directory: DailyLoader
        run: |
          set +e
          echo "=== ICON+FONT CHECK ==="
          APK=$(ls -1 DailyLoader.Android/bin/Release/net9.0-android/publish/*-Signed.apk 2>/dev/null | head -1)
          [ -z "$APK" ] && APK=$(ls -1 DailyLoader.Android/bin/Release/net9.0-android/publish/*.apk 2>/dev/null | head -1)
          echo "APK: $APK"
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          "$AAPT2" dump badging "$APK" 2>/dev/null | grep -Ei 'application(-icon)?:' || echo "(no icon line)"
          unzip -l "$APK" | grep -Ei 'mipmap.*ic_launcher' | head -4 || echo "(no ic_launcher entries)"
          echo "fonts packaged: $(unzip -l "$APK" | grep -ci '\.ttf')"
          echo "=== END ICON+FONT CHECK ==="

      # Keep only the latest run's artifacts: delete artifacts from older runs of
      # this workflow before uploading, which also frees storage so the upload succeeds.
      - name: Prune old artifacts
        uses: ./.github/actions/prune-old-artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Loader-Android
          path: DailyLoader/DailyLoader.Android/bin/Release/net9.0-android/publish/*.apk
          if-no-files-found: error
          retention-days: 90
