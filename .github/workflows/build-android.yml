name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'NytRemarkable/NytRemarkable.Android/**'
      - 'NytRemarkable/NytRemarkable.Infrastructure/**'
      - 'NytRemarkable/NytRemarkable.Domain/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/nytremarkable.keystore

      - name: Build APK
        working-directory: NytRemarkable
        run: >
          dotnet publish NytRemarkable.Android -f net9.0-android -c Release
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore=/tmp/nytremarkable.keystore
          -p:AndroidSigningKeyAlias=${{ secrets.KEY_ALIAS }}
          -p:AndroidSigningKeyPass=${{ secrets.KEY_PASSWORD }}
          -p:AndroidSigningStorePass=${{ secrets.KEYSTORE_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NYT-Crossword-Android
          path: NytRemarkable/NytRemarkable.Android/bin/Release/net9.0-android/publish/*.apk
          if-no-files-found: error
          retention-days: 90
