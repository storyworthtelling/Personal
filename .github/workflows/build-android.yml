name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'Foreword/Foreword.Android/**'
      - 'Foreword/Foreword.Infrastructure/**'
      - 'Foreword/Foreword.Domain/**'
      # The shared Paper & Ink kit. It is net10.0-android, so build-shared-libs can only run its
      # tests — this head is the only thing in the repo that COMPILES it, and without this line a
      # change to the kit would never rebuild the app that proves it builds.
      #
      # The other shared libraries this head references (Voice, Remarkable, Updates) are still not
      # listed, which is the same gap: a change to one of them does not rebuild Foreword. They at
      # least compile under build-shared-libs, so nothing is wholly unproven; noted rather than
      # fixed across every app workflow here.
      - 'Storyworthtelling.Maui/**'
      # Shared libraries that ship in the APK (referenced by Infrastructure/head), so a change rebuilds it.
      - 'Storyworthtelling.Voice/**'
      - 'Storyworthtelling.Diagnostics/**'
      - 'Storyworthtelling.Remarkable/**'
      - '.github/workflows/build-android.yml'

# A newer push to the same branch makes an in-flight run worthless, so cancel it rather than pay
# for both. main is never cancelled: every main run publishes to the rolling release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Foreword's suite had never run in CI. This workflow built the APK, read the icon back out of it
  # and published it to the rolling release — and ran no tests, so every guard in the app (the frozen
  # package id, the delivery worker's registered name, the vault's wire key, the XAML checks, the
  # design tokens) was enforced only by somebody remembering to run them locally. A green build meant
  # "it compiles", in the tone of a workflow that had checked something.
  # Branch pushes run the tests and nothing else — Actions minutes are the budget, and signing an
  # APK on every push of a working branch, then again on merge, is where they went. main (and a
  # manual "Run workflow", which is how a branch gets its APK compiled when it needs one) runs the
  # tests inside the build job instead, so one runner does both rather than two.
  test:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Target the test project directly (not the .sln) so the build never touches the
      # net10.0-android head, which would need the MAUI/Android workload. The -p:ForewordTfms switch
      # keeps Infrastructure single-targeted at net10.0, exactly as the local command does.
      - name: Run tests
        run: >
          dotnet test Foreword/Foreword.Tests/Foreword.Tests.csproj
          -p:ForewordTfms=net10.0

  build:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # actions: write lets the prune step delete artifacts from older runs;
    # contents: write lets the rolling-release step publish the signed APK.
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Target the test project directly (not the .sln) so the build never touches the
      # net10.0-android head, which would need the MAUI/Android workload. The -p:ForewordTfms switch
      # keeps Infrastructure single-targeted at net10.0, exactly as the local command does.
      - name: Run tests
        run: >
          dotnet test Foreword/Foreword.Tests/Foreword.Tests.csproj
          -p:ForewordTfms=net10.0

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/dailyloader.keystore

      # The runner's default JDK is 17. PR #161 fixed exactly this failure on Flyleaf after the
      # runner inherited 17 and javac refused a class-file major 65 binding. Pinned here before
      # anything in this app needs it, rather than after a red build explains why.
      - name: Pin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compute versionCode
        id: version
        uses: ./.github/actions/version-code
        with:
          # Band 7 clears the ~609,000,000 codes the old csproj timestamp scheme reached, so
          # this app keeps upgrading in place. The band is not the version the owner sees.
          band: 7

      - name: Build APK
        working-directory: Foreword
        run: >
          dotnet publish Foreword.Android -f net10.0-android -c Release
          -p:ApplicationVersion=${{ steps.version.outputs.code }}
          -p:ApplicationDisplayVersion=2.0.${{ github.run_number }}
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore=/tmp/dailyloader.keystore
          -p:AndroidSigningKeyAlias=${{ secrets.KEY_ALIAS }}
          -p:AndroidSigningKeyPass=${{ secrets.KEY_PASSWORD }}
          -p:AndroidSigningStorePass=${{ secrets.KEYSTORE_PASSWORD }}

      # Prove the Paper & Ink launcher icon and shared fonts are actually packaged, and FAIL the build
      # if the icon is missing. This head does not set <SingleProject>true</SingleProject>, so anything
      # under Platforms/Android/Resources is silently dropped and android:icon resolves to empty; a plain
      # "it built" hid that. This gate reads the resolved android:icon back out of the APK.
      - name: ICON+FONT CHECK
        working-directory: Foreword
        run: |
          set +e
          echo "=== ICON+FONT CHECK ==="
          APK=$(ls -1 Foreword.Android/bin/Release/net10.0-android/publish/*-Signed.apk 2>/dev/null | head -1)
          [ -z "$APK" ] && APK=$(ls -1 Foreword.Android/bin/Release/net10.0-android/publish/*.apk 2>/dev/null | head -1)
          echo "APK: $APK"
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          [ -z "$AAPT2" ] && AAPT2=$(find "$ANDROID_HOME" -name aapt2 -type f 2>/dev/null | head -1)
          BADGING=$("$AAPT2" dump badging "$APK" 2>/dev/null)
          echo "$BADGING" | grep -Ei 'application(-icon)?:' || echo "(no icon line)"
          unzip -l "$APK" | grep -Ei 'mipmap.*ic_launcher' | head -4 || echo "(no ic_launcher entries)"
          echo "fonts packaged: $(unzip -l "$APK" | grep -ci '\.ttf')"
          echo "=== END ICON+FONT CHECK ==="
          APPICON=$(echo "$BADGING" | grep -E '^application:' | sed -n "s/.*icon='\([^']*\)'.*/\1/p")
          if [ -z "$APPICON" ]; then
            echo "ICON+FONT CHECK FAILED: android:icon is empty — the launcher icon is not packaged/resolved."
            exit 1
          fi
          echo "ICON+FONT CHECK PASSED: android:icon = $APPICON"

      # The count above is printed, not asserted — "fonts packaged: 0" passed this job happily. The
      # eight faces are checked by name here instead, because Foreword takes them through the shared
      # Storyworthtelling.Maui kit's MauiFont rather than a glob of its own: a dropped project
      # reference removes them without breaking the build, and an absent face is never an error at
      # run time either — MAUI substitutes the system face and says nothing.
      - name: FONT CHECK
        working-directory: Foreword
        run: |
          set -e
          echo "=== FONT CHECK ==="
          FONTS="SourceSerif4-Regular SourceSerif4-Semibold SourceSerif4-Italic SourceSerif4-Black SourceSans3-Regular SourceSans3-Semibold CascadiaCode-Regular PinyonScript-Regular"
          APK=$(ls -1 Foreword.Android/bin/Release/net10.0-android/publish/*-Signed.apk 2>/dev/null | head -1)
          [ -z "$APK" ] && APK=$(ls -1 Foreword.Android/bin/Release/net10.0-android/publish/*.apk 2>/dev/null | head -1)
          echo "APK: $APK"
          ENTRIES=$(unzip -l "$APK")
          # Matched by name, not by path: a MAUI head packages fonts under assets/ while the native
          # heads use assets/fonts/, and pinning the wrong one would fail for the wrong reason.
          for font in $FONTS; do
            if ! echo "$ENTRIES" | grep -q "$font.ttf"; then
              echo "FAIL: Foreword is missing $font.ttf"
              echo "$ENTRIES" | grep -i '\.ttf' || echo "(no .ttf entries at all)"
              exit 1
            fi
          done
          echo "ok: all eight fonts packaged"
          echo "=== END FONT CHECK ==="

      # Keep only the latest run's artifacts: delete artifacts from older runs of
      # this workflow before uploading, which also frees storage so the upload succeeds.
      - name: Prune old artifacts
        uses: ./.github/actions/prune-old-artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Foreword-Android
          path: Foreword/Foreword.Android/bin/Release/net10.0-android/publish/*-Signed.apk
          if-no-files-found: error
          retention-days: 90

      # Publish the signed APK to the rolling "apps-latest" release the phone's
      # update channel installs from. main only — feature-branch builds must never
      # reach the device. The versionCode comes from the shared version-code action
      # like every other app now; the csproj's own UTC-timestamp scheme is gone.
      - name: Publish to rolling GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/publish-rolling-release
        with:
          apks: Foreword/Foreword.Android/bin/Release/net10.0-android/publish/*-Signed.apk
