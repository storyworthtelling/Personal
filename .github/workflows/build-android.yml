name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'DailyLoader/DailyLoader.Android/**'
      - 'DailyLoader/DailyLoader.Infrastructure/**'
      - 'DailyLoader/DailyLoader.Domain/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/dailyloader.keystore

      - name: Print signing SHA-1
        run: |
          keytool -list -v \
            -keystore /tmp/dailyloader.keystore \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" > /tmp/cert.txt
          echo "## App signing certificate fingerprints" >> $GITHUB_STEP_SUMMARY
          echo "Register the SHA1 below in your Google Cloud OAuth Android client (package com.storyworthtelling.dailyloader)." >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "SHA1:|SHA256:" /tmp/cert.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Build APK
        working-directory: DailyLoader
        run: >
          dotnet publish DailyLoader.Android -f net9.0-android -c Release
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore=/tmp/dailyloader.keystore
          -p:AndroidSigningKeyAlias=${{ secrets.KEY_ALIAS }}
          -p:AndroidSigningKeyPass=${{ secrets.KEY_PASSWORD }}
          -p:AndroidSigningStorePass=${{ secrets.KEYSTORE_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Loader-Android
          path: DailyLoader/DailyLoader.Android/bin/Release/net9.0-android/publish/*.apk
          if-no-files-found: error
          retention-days: 90
