name: Build Plate APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'FocusPhone/Plate.Android/**'
      - 'FocusPhone/Codex.Ui.Android/**'
      - 'FocusPhone/Codex.Domain/**'
      - 'FocusPhone/Codex.Infrastructure/**'
      - 'FocusPhone/Codex.Tests/**'
      - 'Storyworthtelling.Updates/**'
      - 'Storyworthtelling.Voice/**'
      - '.github/workflows/build-plate.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Target the test project directly (not the .sln) so the build never touches the
      # net10.0-android heads, which would require the Android workload.
      - name: Run tests
        run: dotnet test FocusPhone/Codex.Tests/Codex.Tests.csproj

  build:
    needs: test
    runs-on: ubuntu-latest
    # actions: write lets the prune step delete artifacts from older runs;
    # contents: write lets the rolling-release step publish the signed APK.
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The runner's default JDK is 17, and javac then refuses any binding jar compiled
      # to a newer class-file version — Score's TIDAL binding failed exactly this way
      # ("class file has wrong version 65.0, should be 61.0") the first time CI ran after
      # the Actions outage, and build-flyleaf.yml was pinned to 21 to fix it.
      #
      # Plate is the head most exposed to that: its ML Kit / Play-services bindings pull
      # third-party .aar payloads whose class-file version we do not control. It is also
      # the one head that cannot be compiled in the sandbox at all, so unlike Score there
      # would be no local build to disagree with CI — the first sign would be a red run.
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Plate is plain .NET-for-Android (not MAUI), so the lighter 'android' workload is
      # sufficient. Unlike the sandbox, the runner has network access, which is what lets
      # the ML Kit bindings download their .aar payloads from dl.google.com at build time.
      - name: Install Android workload
        run: dotnet workload install android

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # Plate signs with the same shared repo keystore as every other head, so the whole
      # suite carries one signature — required both for the device-owner silent-update
      # channel and for this build to install IN PLACE over the Camera head it renames.
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/focusphone.keystore

      - name: Compute versionCode
        id: version
        uses: ./.github/actions/version-code
        with:
          band: 1

      - name: Build signed APK
        working-directory: FocusPhone
        env:
          RUN_NUMBER: ${{ github.run_number }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          # Plate graduates from the 0.1 Camera pilot to a 1.x major.
          DISPLAY_VERSION="1.0.$RUN_NUMBER"
          echo "::group::Publishing Plate.Android (versionCode $VERSION_CODE, version $DISPLAY_VERSION)"
          dotnet publish Plate.Android -f net10.0-android -c Release \
            -p:ApplicationVersion=$VERSION_CODE \
            -p:ApplicationDisplayVersion=$DISPLAY_VERSION \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore=/tmp/focusphone.keystore \
            -p:AndroidSigningKeyAlias=${{ secrets.KEY_ALIAS }} \
            -p:AndroidSigningKeyPass=${{ secrets.KEY_PASSWORD }} \
            -p:AndroidSigningStorePass=${{ secrets.KEYSTORE_PASSWORD }}
          echo "::endgroup::"

      # The APK carries the frozen ApplicationId, not the project name — that is what makes
      # this an in-place upgrade rather than a second app on the phone. The id deliberately
      # still says "camera": renaming it would orphan every installed copy. Fatal, because
      # getting it wrong is invisible until the device has two icons and one has no history.
      - name: APP ID CHECK
        working-directory: FocusPhone
        run: |
          set -e
          echo "=== APP ID CHECK ==="
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          APK=$(ls -1 Plate.Android/bin/Release/net10.0-android/publish/*-Signed.apk 2>/dev/null | head -1)
          echo "--- $APK"
          BADGING=$("$AAPT2" dump badging "$APK")
          echo "$BADGING" | head -2
          echo "$BADGING" | grep -q "name='com.storyworthtelling.focusphone.camera'" || {
            echo "FAIL: Plate's APK does not carry the frozen camera ApplicationId."
            exit 1
          }
          echo "ok: frozen ApplicationId present"
          echo "=== END APP ID CHECK ==="

      # FATAL here, unlike the other heads' print-only version. Two apps in this repo
      # shipped the DEFAULT launcher icon for months because the resource-folder and
      # [Application(Icon=…)] wiring is easy to get wrong and silent when it is — a check
      # that only prints is a check nobody reads until someone looks at the phone.
      - name: ICON CHECK
        working-directory: FocusPhone
        run: |
          set -e
          echo "=== ICON CHECK ==="
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          APK=$(ls -1 Plate.Android/bin/Release/net10.0-android/publish/*-Signed.apk 2>/dev/null | head -1)
          echo "--- $APK"
          ICON=$("$AAPT2" dump badging "$APK" 2>/dev/null | grep -Eo "application-icon-[0-9]+:'[^']*'" | head -1)
          echo "${ICON:-(no icon line)}"
          if [ -z "$ICON" ]; then
            echo "FAIL: the APK declares no launcher icon."
            exit 1
          fi
          unzip -l "$APK" | grep -Eiq 'mipmap.*appicon' || {
            echo "FAIL: no mipmap appicon resources in the APK."
            unzip -l "$APK" | grep -Ei 'mipmap' | head -10
            exit 1
          }
          echo "ok: launcher icon declared and packaged"
          echo "=== END ICON CHECK ==="

      # Fatal: prove EVERY packaged font is at the exact internal path PaperTheme.Load
      # reads from (assets/fonts/<name>.ttf). Counting ".ttf" is not enough — a Link
      # separator bug can pack one under a wrong literal name so Assets.Open fails and the
      # head crashes on launch.
      #
      # This lists all EIGHT, where the other workflows list six. The two they omit are the
      # two most visible fonts in the suite: SourceSerif4-Black, which every screen header
      # renders in, and PinyonScript-Regular, which is the owner's voice. Codex.Ui.Android
      # globs Fonts/*.ttf so they do ship — but the whole point of this check is the case
      # where the glob's output is misfiled, and it currently would not notice.
      - name: FONT CHECK
        working-directory: FocusPhone
        run: |
          set -e
          echo "=== FONT CHECK ==="
          FONTS="SourceSerif4-Regular SourceSerif4-Semibold SourceSerif4-Italic SourceSerif4-Black SourceSans3-Regular SourceSans3-Semibold CascadiaCode-Regular PinyonScript-Regular"
          APK=$(ls -1 Plate.Android/bin/Release/net10.0-android/publish/*-Signed.apk 2>/dev/null | head -1)
          echo "--- $APK"
          ENTRIES=$(unzip -l "$APK")
          for font in $FONTS; do
            if ! echo "$ENTRIES" | grep -q "assets/fonts/$font.ttf"; then
              echo "FAIL: Plate is missing assets/fonts/$font.ttf"
              echo "$ENTRIES" | grep -i '\.ttf' || echo "(no .ttf entries at all)"
              exit 1
            fi
          done
          echo "ok: all eight fonts at assets/fonts/"
          echo "=== END FONT CHECK ==="

      # Keep only the latest run's artifacts: delete artifacts from older runs of this
      # workflow before uploading, which also frees storage so the upload succeeds.
      - name: Prune old artifacts
        uses: ./.github/actions/prune-old-artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Plate-Android
          path: FocusPhone/Plate.Android/bin/Release/net10.0-android/publish/*-Signed.apk
          if-no-files-found: error
          retention-days: 90

      # Publish the signed head to the rolling "apps-latest" release the phone's update
      # channel installs from. main only — feature-branch builds must never reach the
      # device. The asset name is derived from the frozen ApplicationId, so this clobbers
      # the camera asset build-flyleaf used to publish rather than leaving a stale
      # duplicate beside it.
      - name: Publish to rolling GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/publish-rolling-release
        with:
          apks: FocusPhone/Plate.Android/bin/Release/net10.0-android/publish/*-Signed.apk
