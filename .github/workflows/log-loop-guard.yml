name: Log loop guard

# LOG-LOOP-PLAN.md §6.1, layer 4 — the content-free half of the leak scan, on every claude/** push and every
# PR to main. It holds no log plaintext, so it looks only for shapes in the ADDED lines: a Luhn-valid
# card-like number, an address outside example.com, a phone number that is not a 555 number, an OAuth-code-
# or token-shaped string, a key shape, a house-precise coordinate pair, a real lender's name, and (on
# claude/logfix-* branches only) a dollar amount in a test. It also runs the repo-wide NoKeys and
# InventedData guards over the whole tree. A hit is not a
# code risk the owner waived; it is the public-repository rule, and it always blocks. Branch protection
# requires this job on main, and the auto-merge gate waits for it.
#
# It also runs the reader's own tests, since the gate and the scans are the reader's code, and every
# cross-app contract guard, since no single app's workflow watches both sides of a contract.
on:
  push:
    branches: ['claude/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A push to a branch with a PR open fires both triggers, and the guard ran twice over the same
  # commit. The PR's run is the one branch protection reads, so the push's run steps aside for it —
  # a few seconds on a bare runner instead of the whole guard. If the question cannot be answered,
  # the guard runs: paying twice is the lesser failure than checking nothing.
  covered:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      open: ${{ steps.pr.outputs.open }}
    steps:
      - name: Is a pull request already checking this branch?
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh pr list --repo "${{ github.repository }}" --head "${{ github.ref_name }}" --base main --state open --json number --jq length || echo "")
          echo "open=$open" >> "$GITHUB_OUTPUT"

  log-loop-guard:
    name: log-loop-guard
    needs: covered
    if: >-
      always() && !(github.event_name == 'push'
      && needs.covered.outputs.open != '' && needs.covered.outputs.open != '0')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/dotnet

      - name: Test the reader (fetch, digest, sanitize, leakscan, gate)
        run: dotnet test Tools/LogLoopReader.Tests/LogLoopReader.Tests.csproj

      # The whole tree, not just the added lines: no key shape and no real-looking contact,
      # address or lender anywhere (RepoGuards.Tests reads the same detectors as leakscan).
      - name: Scan the whole repository (NoKeys, InventedData)
        run: dotnet test RepoGuards.Tests/RepoGuards.Tests.csproj

      # Audit W2 (09 M4): each app's workflow watches only its own folders, so a change to one side of a
      # cross-app contract could pass while the other side's guard never ran. Every contract guard runs here,
      # on every push, whichever folder changed. RepoGuards' ContractPermissionsTests ran in the step above.
      - name: Cross-app contract guards
        env:
          CONTRACTS: FullyQualifiedName~Contract|FullyQualifiedName~PlateStatementRead|FullyQualifiedName~PaperRead|FullyQualifiedName~RestrictedBrowserHandoff
        run: |
          set -euo pipefail
          dotnet test FocusPhone/Codex.Tests/Codex.Tests.csproj --filter "$CONTRACTS"
          dotnet test Ledger/Ledger.Tests/Ledger.Tests.csproj -p:LedgerTfms=net10.0 --filter "$CONTRACTS"
          dotnet test Pulp/Pulp.Tests/Pulp.Tests.csproj --filter "$CONTRACTS"
          dotnet test Constitution/Constitution.Tests/Constitution.Tests.csproj --filter "$CONTRACTS"

      - name: Scan the added lines
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git diff origin/main...HEAD > "$RUNNER_TEMP/added.diff"
          dotnet run --project Tools/LogLoopReader --no-build -- \
            leakscan --ci --diff "$RUNNER_TEMP/added.diff" --branch "$BRANCH"
